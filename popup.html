<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Quick URL Copy</title>
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<main id="app">
		<header class="header">
			<div>
				<p id="summary">No URLs collected.</p>
			</div>
			<button id="modeButton" class="icon-button" type="button" title="Switch display mode" aria-label="Switch display mode">↔</button>
		</header>

		<section id="detailView">
			<textarea id="urlList" spellcheck="false" aria-label="Collected URLs"></textarea>

			<div class="actions">
				<button id="refreshButton" type="button">Refresh</button>
				<button id="copyButton" class="primary" type="button">Copy</button>
			</div>

			<p id="statusLabel" class="status" role="status" aria-live="polite"></p>

			<div class="toolbar">
				<label>
					Range
					<select id="rangeSelect">
						<option value="current">Active tab</option>
						<option value="window">Current window</option>
						<option value="all">All tabs</option>
					</select>
				</label>
				<label>
					Format
					<select id="formatSelect">
						<option value="url">URL</option>
						<option value="title-url">Title + URL: {title}\t{url}\n</option>
					</select>
				</label>
			</div>
		</section>

		<section id="compactView" hidden>
			<div id="compactValue" class="compact-value"></div>
			<p id="compactStatus" class="status" role="status" aria-live="polite"></p>
		</section>
	</main>

	<script src="popup.js"></script>
</body>
</html>
