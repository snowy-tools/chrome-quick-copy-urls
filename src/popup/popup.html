<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Quick URL Copy</title>
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<main id="app">
		<header class="header">
			<p id="statusLabel" class="status" role="status" aria-live="polite">No URLs collected.</p>
			<button id="modeButton" class="icon-button" type="button" title="Switch to detailed view" aria-label="Switch display mode" aria-expanded="false">▼</button>
		</header>

		<textarea id="urlList" spellcheck="false" aria-label="Collected URLs"></textarea>

		<section id="detailControls">
			<div class="actions">
				<button id="refreshButton" type="button">Refresh</button>
				<button id="copyButton" class="primary" type="button">Copy</button>
			</div>

			<div class="actions">
				<button id="sortButton" type="button">Sort</button>
			</div>

			<div class="toolbar">
				<div class="toolbar-left">
					<fieldset id="rangeSelect">
						<legend>Range:</legend>
						<label><input type="radio" name="range" value="current"> Active tab</label>
						<label><input type="radio" name="range" value="group"> Same group</label>
						<label><input type="radio" name="range" value="window"> Current window</label>
						<label><input type="radio" name="range" value="all"> All tabs</label>
					</fieldset>
					<fieldset id="filterSelect">
						<legend>Filter:</legend>
						<label><input type="checkbox" name="filterBlankUrls" checked> Remove blank URLs</label>
						<label><input type="checkbox" name="filterDuplicateUrls" checked> Remove duplicate URLs</label>
						<label><input type="checkbox" name="filterSpecialUrls" checked> Remove special URLs</label>
					</fieldset>
				</div>
				<fieldset id="formatSelect">
					<legend>Format:</legend>
					<label><input type="radio" name="format" value="url"> URL</label>
					<label><input type="radio" name="format" value="csv"> CSV: title,url</label>
					<label><input type="radio" name="format" value="tsv"> TSV: title\turl\n</label>
					<label><input type="radio" name="format" value="json"> JSON: [{"title":"...","url":"..."}]</label>
					<label><input type="radio" name="format" value="html-link"> HTML: &lt;ul&gt;...&lt;/ul&gt;</label>
					<label><input type="radio" name="format" value="markdown-link"> Markdown: [title](url)</label>
				</fieldset>
			</div>
		</section>
	</main>

	<script type="module" src="popup.js"></script>
</body>
</html>
