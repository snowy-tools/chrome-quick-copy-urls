<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Quick Copy URLs</title>
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<main id="app">
		<header class="header">
			<p id="statusLabel" class="status" role="status" aria-live="polite">No URLs collected.</p>
			<button id="modeButton" class="icon-button" type="button" title="Switch to detailed view" aria-label="Switch display mode" aria-expanded="false">▼</button>
		</header>

		<textarea id="urlList" spellcheck="false" aria-label="Collected URLs"></textarea>

		<section id="detailControls">
			<div class="actions-row">
				<div class="actions actions-left">
					<button id="sortButton" type="button">Sort</button>
					<button id="reverseButton" type="button">Reverse</button>
				</div>
				<div class="actions actions-right">
					<button id="refreshButton" type="button">Refresh</button>
					<button id="copyButton" class="primary" type="button">Copy</button>
				</div>
			</div>

			<div class="toolbar">
				<div class="toolbar-left">
					<fieldset id="rangeSelect">
						<legend>Range:</legend>
						<label><input type="radio" name="range" value="current"> Active tab</label>
						<label><input type="radio" name="range" value="highlighted"> Selected tabs</label>
						<label><input type="radio" name="range" value="group"> Same group</label>
						<label><input type="radio" name="range" value="window"> Current window</label>
						<label><input type="radio" name="range" value="all"> All tabs</label>
					</fieldset>
					<fieldset id="filterSelect">
						<legend>Filter:</legend>
						<label><input type="checkbox" name="filterBlankUrls" checked> Remove blank URLs</label>
						<label><input type="checkbox" name="filterDuplicateUrls" checked> Remove duplicate URLs</label>
						<label><input type="checkbox" name="filterSpecialUrls" checked> Remove special URLs</label>
					</fieldset>
				</div>
				<fieldset id="formatSelect">
					<legend>Format:</legend>
					<label><input type="radio" name="format" value="url"><span class="label-text">URL</span></label>
					<label><input type="radio" name="format" value="csv"><span class="label-text">CSV:<wbr>&nbsp;title,url</span></label>
					<label><input type="radio" name="format" value="tsv"><span class="label-text">TSV:<wbr>&nbsp;title\turl\n</span></label>
					<label><input type="radio" name="format" value="json"><span class="label-text">JSON:<wbr>&nbsp;[{"title":"...","url":"..."}]</span></label>
					<label><input type="radio" name="format" value="html-link"><span class="label-text">HTML:<wbr>&nbsp;&lt;a&nbsp;href="url"&gt;title&lt;/a&gt;</span></label>
					<label><input type="radio" name="format" value="markdown-link"><span class="label-text">Markdown:<wbr>&nbsp;[title](url)</span></label>
				</fieldset>
			</div>
		</section>
	</main>

	<script type="module" src="popup.js"></script>
</body>
</html>
